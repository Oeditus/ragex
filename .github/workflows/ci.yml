name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  MIX_ENV: test
  ELIXIR_VERSION: '1.20'
  OTP_VERSION: '29'
  # Pin the XLA build target to CPU. GitHub-hosted runners have no NVIDIA GPU
  # and no CUDA runtime, and `xla` reads XLA_TARGET at dependency compile time
  # to choose which precompiled archive to download. Leaving it unset lets
  # Ragex.CudaDetector infer a CUDA target from a host environment that cannot
  # actually build or link against it, which fails `mix deps.compile exla`.
  XLA_TARGET: cpu
  EXLA_CPU_ONLY: 'true'

jobs:
  deps:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Ragex build environment
      id: setup
      uses: ./.github/actions/setup-ragex
      with:
        elixir-version: ${{ env.ELIXIR_VERSION }}
        otp-version: ${{ env.OTP_VERSION }}

    - name: Install dependencies
      if: steps.setup.outputs.cache-hit != 'true'
      run: mix deps.get

    - name: Compile dependencies
      if: steps.setup.outputs.cache-hit != 'true'
      run: mix deps.compile

  compile:
    name: Compile
    needs: deps
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Ragex build environment
      uses: ./.github/actions/setup-ragex
      with:
        elixir-version: ${{ env.ELIXIR_VERSION }}
        otp-version: ${{ env.OTP_VERSION }}

    - name: Compile (warnings as errors)
      run: mix compile --warnings-as-errors

  credo:
    name: Credo
    needs: deps
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Ragex build environment
      uses: ./.github/actions/setup-ragex
      with:
        elixir-version: ${{ env.ELIXIR_VERSION }}
        otp-version: ${{ env.OTP_VERSION }}

    - name: Run Credo (strict mode)
      run: mix credo --strict

    - name: Audit dependencies for known vulnerabilities
      run: mix deps.audit --ignore-advisory-ids GHSA-rhv4-8758-jx7v

  test:
    name: Test
    needs: deps
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Ragex build environment
      uses: ./.github/actions/setup-ragex
      with:
        elixir-version: ${{ env.ELIXIR_VERSION }}
        otp-version: ${{ env.OTP_VERSION }}

    - name: Install Ruby parser gem
      run: gem install --user-install parser

    - name: Install Node parser dependencies
      run: cd priv/js_parser && npm ci

    - name: Cache Haskell parser
      id: cache-haskell-parser
      uses: actions/cache@v4
      with:
        path: |
          ~/.stack
          deps/metastatic/priv/parsers/haskell/.stack-work
          deps/metastatic/priv/parsers/haskell/bin
        key: ${{ runner.os }}-haskell-parser-${{ hashFiles('deps/metastatic/priv/parsers/haskell/stack.yaml.lock', 'deps/metastatic/priv/parsers/haskell/Parser.hs', 'deps/metastatic/priv/parsers/haskell/package.yaml') }}
        restore-keys: |
          ${{ runner.os }}-haskell-parser-

    - name: Build Haskell parser
      if: steps.cache-haskell-parser.outputs.cache-hit != 'true'
      run: |
        cd deps/metastatic/priv/parsers/haskell
        stack install --local-bin-path bin

    # Agda and Cure tests are excluded: neither toolchain is installed on the
    # runner, and the upstream adapters are already excluded the same way in
    # metastatic's CI.
    - name: Run tests with coverage
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: mix coveralls.github --exclude resource_intensive --exclude agda --exclude cure

  analysis:
    name: Diff Analysis
    env:
      RAGEX_STORE_BACKEND: ets
    if: github.event_name == 'pull_request'
    needs: deps
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Ragex build environment
      uses: ./.github/actions/setup-ragex
      with:
        elixir-version: ${{ env.ELIXIR_VERSION }}
        otp-version: ${{ env.OTP_VERSION }}

    - name: Set up Cure
      uses: cure-lang/setup-cure@v1

    - name: Install Node parser dependencies
      run: cd priv/js_parser && npm ci

    - name: Run diff analysis
      run: mix ragex.ci --no-db --no-user --base origin/${{ github.base_ref }} --format github

  hex_package:
    name: Hex package compatibility
    runs-on: ubuntu-latest
    env:
      MIX_ENV: dev
      RAGEX_HEX_BUILD: '1'
    steps:
    - uses: actions/checkout@v4

    - uses: erlef/setup-beam@v1
      with:
        elixir-version: ${{ env.ELIXIR_VERSION }}
        otp-version: ${{ env.OTP_VERSION }}

    - name: Cache package-profile dependencies
      uses: actions/cache@v4
      with:
        path: |
          deps_hex
          _build_hex
        key: ${{ runner.os }}-hex-profile-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-cpu-${{ hashFiles('mix.hex.lock') }}

    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y libgit2-dev pkg-config

    - name: Resolve and compile without overrides
      run: |
        mix deps.get
        mix compile --warnings-as-errors

    - name: Test the package-compatible ML and Image stack
      run: |
        MIX_ENV=test mix test test/embeddings/bumblebee_test.exs test/ragex/image_test.exs test/mcp/handlers/image_tools_test.exs

    - name: Build and inspect the package without publishing
      run: |
        mix hex.build --output "$RUNNER_TEMP/ragex.tar"
        elixir scripts/verify_hex_package.exs "$RUNNER_TEMP/ragex.tar"

  ci:
    name: CI
    needs: [compile, credo, test, hex_package]
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Check job results
      run: |
        if [ "${{ needs.compile.result }}" != "success" ] || \
           [ "${{ needs.credo.result }}" != "success" ] || \
           [ "${{ needs.test.result }}" != "success" ] || \
           [ "${{ needs.hex_package.result }}" != "success" ]; then
          echo "One or more jobs failed"
          exit 1
        fi
