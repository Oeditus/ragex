name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  MIX_ENV: test
  ELIXIR_VERSION: '1.18'
  OTP_VERSION: '27'

jobs:
  deps:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Ragex build environment
      id: setup
      uses: ./.github/actions/setup-ragex
      with:
        elixir-version: ${{ env.ELIXIR_VERSION }}
        otp-version: ${{ env.OTP_VERSION }}

    - name: Install dependencies
      if: steps.setup.outputs.cache-hit != 'true'
      run: mix deps.get

    - name: Compile dependencies
      if: steps.setup.outputs.cache-hit != 'true'
      run: mix deps.compile

  compile:
    name: Compile
    needs: deps
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Ragex build environment
      uses: ./.github/actions/setup-ragex
      with:
        elixir-version: ${{ env.ELIXIR_VERSION }}
        otp-version: ${{ env.OTP_VERSION }}

    - name: Compile (warnings as errors)
      run: mix compile --warnings-as-errors

  credo:
    name: Credo
    needs: deps
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Ragex build environment
      uses: ./.github/actions/setup-ragex
      with:
        elixir-version: ${{ env.ELIXIR_VERSION }}
        otp-version: ${{ env.OTP_VERSION }}

    - name: Run Credo (strict mode)
      run: mix credo --strict

    - name: Audit dependencies for known vulnerabilities
      run: mix deps.audit --ignore-advisory-ids GHSA-rhv4-8758-jx7v

  test:
    name: Test
    needs: deps
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Ragex build environment
      uses: ./.github/actions/setup-ragex
      with:
        elixir-version: ${{ env.ELIXIR_VERSION }}
        otp-version: ${{ env.OTP_VERSION }}

    - name: Install Ruby parser gem
      run: gem install --user-install parser

    - name: Install Node parser dependencies
      run: cd priv/js_parser && npm ci

    - name: Run tests with coverage
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: mix coveralls.github --exclude resource_intensive

  analysis:
    name: Diff Analysis
    if: github.event_name == 'pull_request'
    needs: deps
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Ragex build environment
      uses: ./.github/actions/setup-ragex
      with:
        elixir-version: ${{ env.ELIXIR_VERSION }}
        otp-version: ${{ env.OTP_VERSION }}

    - name: Install Node parser dependencies
      run: cd priv/js_parser && npm ci

    - name: Run diff analysis
      run: mix ragex.ci --base origin/${{ github.base_ref }} --format github

  ci:
    name: CI
    needs: [compile, credo, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Check job results
      run: |
        if [ "${{ needs.compile.result }}" != "success" ] || \
           [ "${{ needs.credo.result }}" != "success" ] || \
           [ "${{ needs.test.result }}" != "success" ]; then
          echo "One or more jobs failed"
          exit 1
        fi
